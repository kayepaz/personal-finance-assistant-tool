name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Start-up smoke test
        run: |
          PFAT_DATA_DIR="$RUNNER_TEMP/pfat" PFAT_PORT=8787 deno task start &
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8787/api/status; then exit 0; fi
            sleep 1
          done
          echo "server did not start" && exit 1
